      <text class="uNum" x="21" y="622">U8</text><text class="uNum" x="624" y="622">U8</text>
      <text class="uNum" x="21" y="672">U7</text><text class="uNum" x="624" y="672">U7</text>
      <text class="uNum" x="21" y="722">U6</text><text class="uNum" x="624" y="722">U6</text>
      <text class="uNum" x="21" y="772">U5</text><text class="uNum" x="624" y="772">U5</text>
      <text class="uNum" x="21" y="822">U4</text><text class="uNum" x="624" y="822">U4</text>
      <text class="uNum" x="21" y="872">U3</text><text class="uNum" x="624" y="872">U3</text>
      <text class="uNum" x="21" y="922">U2</text><text class="uNum" x="624" y="922">U2</text>
      <text class="uNum" x="21" y="972">U1</text><text class="uNum" x="624" y="972">U1</text>
    </g>


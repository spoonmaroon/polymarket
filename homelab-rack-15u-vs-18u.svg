    <rect class="rail" x="38" y="90" width="28" height="840" rx="3"/>
    <rect class="rail" x="584" y="90" width="28" height="840" rx="3"/>
    <rect x="82" y="90" width="486" height="840" fill="#0e1117" stroke="#252d38"/>
    <rect class="glow" x="82" y="90" width="486" height="840"/>


      <line class="uLine" x1="82" y1="706" x2="568" y2="706"/>
      <line class="uLine" x1="82" y1="762" x2="568" y2="762"/>
      <line class="uLine" x1="82" y1="818" x2="568" y2="818"/>
      <line class="uLine" x1="82" y1="874" x2="568" y2="874"/>

    <rect class="shelf" x="102" y="208" width="446" height="44" rx="5"/>
    <text class="boxText" x="124" y="236">1U shelf: router/gateway + HP ProDesk</text>
    <rect class="future" x="102" y="264" width="446" height="44" rx="5"/>
    <text class="boxText" x="124" y="292">U12: QNAP TS-433eU OR vent/blank</text>

    <rect class="pc" x="102" y="320" width="446" height="212" rx="6"/>
    <text class="boxText" x="124" y="358">Sliger CX4170a / PC 1</text>
    <text class="boxSmall" x="124" y="382">Ryzen 7700X + RTX 5060 Ti</text>
    <circle cx="508" cy="356" r="10" fill="#d9e1ec"/>

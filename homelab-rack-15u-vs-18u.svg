    <text class="boxSmall" x="124" y="706">i7-12700F + RTX 3060 Ti + storage bays</text>
    <g fill="#050607" stroke="#303a47">
      <rect x="122" y="734" width="75" height="31"/><rect x="205" y="734" width="75" height="31"/><rect x="288" y="734" width="75" height="31"/><rect x="371" y="734" width="75" height="31"/><rect x="454" y="734" width="75" height="31"/>

      <text class="uNum" x="21" y="854">U2</text><text class="uNum" x="624" y="854">U2</text>
      <text class="uNum" x="21" y="910">U1</text><text class="uNum" x="624" y="910">U1</text>
    </g>

    <rect class="patch" x="102" y="96" width="446" height="44" rx="5"/>
    <text class="boxText" x="124" y="124" fill="#111">24-port keystone patch panel</text>
    <g stroke="#8d98a6" stroke-width="2" fill="#111827">
      <rect x="382" y="108" width="14" height="12"/><rect x="402" y="108" width="14" height="12"/><rect x="422" y="108" width="14" height="12"/><rect x="442" y="108" width="14" height="12"/><rect x="462" y="108" width="14" height="12"/><rect x="482" y="108" width="14" height="12"/>

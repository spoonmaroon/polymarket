    </g>
    <rect class="ups" x="102" y="846" width="446" height="88" rx="5"/>
    <text class="boxText" x="124" y="888">CyberPower CP1500PFCRM2U-style 2U UPS</text>
    <text class="boxSmall" x="124" y="912">2U gives safer shutdown margin than a 1U 300W UPS</text>
    <rect class="pdu" x="102" y="946" width="446" height="38" rx="5"/>
    <text class="boxText" x="124" y="971">U1 blank/front PDU; rear PDU preferred</text>

    <text class="good" x="0" y="1038">Recommendation: buy the 18U rack. It is cleaner, easier to wire, and leaves room for the QNAP/future drives.</text>
  </g>

  <g transform="translate(90,1120)">
    <text class="tiny" x="0" y="0">Notes: the PDU can be mounted on the rear vertical rail or back side instead of consuming a front U. For heavy 4U PCs, use proper rails/sliding shelves, not Rackstuds. Patch panel and switch can use Rackstuds/cage nuts.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #0b0d10; }
      .panel { fill: #12161c; stroke: #333b46; stroke-width: 2; }
      .rail { fill: #050607; stroke: #555d66; stroke-width: 2; }
      .uLine { stroke: #2b3139; stroke-width: 1; }
      .label { fill: #f4f7fb; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .sub { fill: #b8c0cc; font-family: Inter, Arial, sans-serif; font-size: 16px; }
      .tiny { fill: #dbe2ec; font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .uNum { fill: #9aa4b2; font-family: Inter, Arial, sans-serif; font-size: 12px; }
      .boxText { fill: #f8fbff; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .boxSmall { fill: #d7dee8; font-family: Inter, Arial, sans-serif; font-size: 12px; }
      .patch { fill: #f4f7fb; stroke: #d9e1eb; }
      .switch { fill: #eef3f9; stroke: #cbd6e2; }
      .shelf { fill: #202733; stroke: #4c5666; }
      .vent { fill: #151a22; stroke: #2e3744; }
      .pc { fill: #0d0f12; stroke: #424b57; }
      .nas { fill: #10141a; stroke: #59616c; }
      .ups { fill: #08090b; stroke: #505865; }
      .pdu { fill: #1a1d23; stroke: #4a5360; }
      .future { fill: #151a20; stroke: #3f7b61; stroke-dasharray: 8 6; }
      .warn { fill: #ffd166; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .good { fill: #83f7c4; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .cable { fill: none; stroke: #f8f9ff; stroke-width: 4; stroke-linecap: round; opacity: .92; }
      .cable2 { fill: none; stroke: #c98bff; stroke-width: 3; stroke-linecap: round; opacity: .78; }
      .glow { fill: #a46cff; opacity: .16; }
    </style>
    <linearGradient id="purpleGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#6de5ff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#c98bff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>
  <text class="label" x="90" y="76" font-size="34">Homelab Rack Visual: 15U Tight Fit vs 18U Better Fit</text>
  <text class="sub" x="90" y="108">Current parts: UniFi patch panel + Pro Max 16, HP ProDesk/small router shelf, Sliger CX4170a, Sliger CX4712, CyberPower-style UPS, rear PDU, white/rainbow short patch cables.</text>

  <!-- 15U rack -->
  <g transform="translate(110,150)">
    <text class="label" x="0" y="0">15U layout: works, but cramped</text>
    <text class="sub" x="0" y="28">Best if you skip QNAP for now or use a small 1U UPS. PDU should mount rear/side if possible.</text>

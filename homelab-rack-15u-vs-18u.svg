    <rect class="nas" x="102" y="600" width="446" height="212" rx="6"/>
    <text class="boxText" x="124" y="638">Sliger CX4712 / PC 2 Unraid</text>
    <text class="boxSmall" x="124" y="662">i7-12700F + RTX 3060 Ti + 10x hot-swap bay face</text>
    <g fill="#050607" stroke="#303a47">
      <rect x="122" y="694" width="75" height="36"/><rect x="205" y="694" width="75" height="36"/><rect x="288" y="694" width="75" height="36"/><rect x="371" y="694" width="75" height="36"/><rect x="454" y="694" width="75" height="36"/>
      <rect x="122" y="738" width="75" height="36"/><rect x="205" y="738" width="75" height="36"/><rect x="288" y="738" width="75" height="36"/><rect x="371" y="738" width="75" height="36"/><rect x="454" y="738" width="75" height="36"/>
    </g>

    <rect class="ups" x="102" y="824" width="446" height="44" rx="5"/>
    <text class="boxText" x="124" y="852">1U UPS only, or make this first row of 2U CP1500</text>
    <rect class="pdu" x="102" y="880" width="446" height="44" rx="5"/>
    <text class="boxText" x="124" y="908">1U PDU if front-mounted; better mounted rear/side</text>

    <text class="warn" x="0" y="970">Reality check: 15U fits on paper, but it leaves almost no future space and less airflow/cable room.</text>
  </g>

  <!-- 18U rack -->
  <g transform="translate(985,150)">
    <text class="label" x="0" y="0">18U layout: recommended</text>
    <text class="sub" x="0" y="28">Same footprint style, but cleaner wiring, 2U UPS, optional QNAP, and actual service room.</text>
    <rect class="panel" x="0" y="58" width="650" height="970" rx="14"/>
    <rect class="rail" x="38" y="90" width="28" height="900" rx="3"/>
    <rect class="rail" x="584" y="90" width="28" height="900" rx="3"/>
    <rect x="82" y="90" width="486" height="900" fill="#0e1117" stroke="#252d38"/>
    <rect class="glow" x="82" y="90" width="486" height="900"/>

    <!-- U grid 18 * 50 = 900 -->
    <g>
      <line class="uLine" x1="82" y1="90" x2="568" y2="90"/><line class="uLine" x1="82" y1="140" x2="568" y2="140"/>
      <line class="uLine" x1="82" y1="190" x2="568" y2="190"/><line class="uLine" x1="82" y1="240" x2="568" y2="240"/>

[project]
name = "polymarket-engine"
version = "0.1.0"
description = "Multi-venue crypto binary pricing and paper-trading research system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "pytz>=2024.1",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0.0",
]

[project.scripts]
polymarket-engine = "polymarket_engine.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

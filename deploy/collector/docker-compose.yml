name: polymarket-rust-collector

services:
  collector:
    build:
      context: ../..
      dockerfile: deploy/collector/Dockerfile
    image: ${POLYMARKET_COLLECTOR_IMAGE:-polymarket-rust-collector:latest}
    restart: unless-stopped
    user: "${POLYMARKET_UID:-1000}:${POLYMARKET_GID:-1000}"
    environment:
      TZ: ${POLYMARKET_DISPLAY_TZ:-America/Chicago}
      POLYMARKET_ASSETS: ${POLYMARKET_ASSETS:-BTC,ETH}
      POLYMARKET_INTERVAL: ${POLYMARKET_INTERVAL:-5m}
      POLYMARKET_PREWARM_WINDOWS: ${POLYMARKET_PREWARM_WINDOWS:-2}
      POLYMARKET_STATUS_INTERVAL_MS: ${POLYMARKET_STATUS_INTERVAL_MS:-100}
      POLYMARKET_PREWARM_BEFORE_EXPIRY_MS: ${POLYMARKET_PREWARM_BEFORE_EXPIRY_MS:-30000}
      POLYMARKET_STALE_CHAINLINK_AFTER_MS: ${POLYMARKET_STALE_CHAINLINK_AFTER_MS:-5000}
      POLYMARKET_STALE_ORDERBOOK_AFTER_MS: ${POLYMARKET_STALE_ORDERBOOK_AFTER_MS:-30000}
      POLYMARKET_REST_BACKUP_INTERVAL_MS: ${POLYMARKET_REST_BACKUP_INTERVAL_MS:-1000}
      POLYMARKET_STATUS_PATH: /var/lib/polymarket/live/status.json
      POLYMARKET_STATE_SNAPSHOT_DIR: /var/lib/polymarket/raw/polymarket_state_manager/state_snapshot
      POLYMARKET_STATE_SNAPSHOT_INTERVAL_MS: ${POLYMARKET_STATE_SNAPSHOT_INTERVAL_MS:-5000}
      POLYMARKET_RAW_EVENT_DIR: /var/lib/polymarket/raw
      POLYMARKET_RAW_EVENT_BUFFER_SIZE: ${POLYMARKET_RAW_EVENT_BUFFER_SIZE:-16384}
      POLYMARKET_DECISION_SNAPSHOT_DIR: /var/lib/polymarket/raw
      POLYMARKET_DECISION_EVENT_BUFFER_SIZE: ${POLYMARKET_DECISION_EVENT_BUFFER_SIZE:-16384}
    volumes:
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/raw:/var/lib/polymarket/raw
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/db:/var/lib/polymarket/db
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/live:/var/lib/polymarket/live
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/logs:/var/lib/polymarket/logs
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "/usr/local/bin/check_collector_status.py",
          "--status-path",
          "/var/lib/polymarket/live/status.json",
          "--max-status-age-seconds",
          "30",
          "--max-price-age-ms",
          "30000",
          "--max-orderbook-age-ms",
          "30000",
          "--max-websocket-event-age-ms",
          "30000",
          "--raw-root",
          "/var/lib/polymarket/raw",
          "--max-raw-event-age-ms",
          "30000",
          "--normalized-health-path",
          "/var/lib/polymarket/live/normalized_health.json",
          "--max-normalized-health-age-ms",
          "30000",
          "--expected-prewarm-windows",
          "${POLYMARKET_PREWARM_WINDOWS:-2}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    tmpfs:
      - /tmp

  normalizer:
    build:
      context: ../..
      dockerfile: deploy/normalizer/Dockerfile
    image: ${POLYMARKET_NORMALIZER_IMAGE:-polymarket-normalizer:latest}
    restart: unless-stopped
    user: "${POLYMARKET_UID:-1000}:${POLYMARKET_GID:-1000}"
    depends_on:
      - collector
    environment:
      TZ: ${POLYMARKET_DISPLAY_TZ:-America/Chicago}
      POLYMARKET_RAW_DIR: /var/lib/polymarket/raw
      POLYMARKET_DUCKDB_PATH: /var/lib/polymarket/db/polymarket.duckdb
      POLYMARKET_LIVE_DIR: /var/lib/polymarket/live
      POLYMARKET_STATUS_PATH: /var/lib/polymarket/live/status.json
      POLYMARKET_NORMALIZED_HEALTH_PATH: /var/lib/polymarket/live/normalized_health.json
      POLYMARKET_PROBABILITY_STATUS_PATH: /var/lib/polymarket/live/probabilities.json
      POLYMARKET_PROBABILITY_INPUTS_PATH: /var/lib/polymarket/live/probability_inputs.json
      POLYMARKET_PROBABILITY_FRAGMENTS_PATH: /var/lib/polymarket/live/probability_fragments.json
      POLYMARKET_OUTCOME_STATUS_PATH: /var/lib/polymarket/live/outcomes.json
      POLYMARKET_VOLATILITY_STATUS_PATH: /var/lib/polymarket/live/volatility.json
      POLYMARKET_OFFICIAL_OUTCOME_SOURCE: ${POLYMARKET_OFFICIAL_OUTCOME_SOURCE:-clob}
      POLYMARKET_OFFICIAL_OUTCOME_TIMEOUT_SECONDS: ${POLYMARKET_OFFICIAL_OUTCOME_TIMEOUT_SECONDS:-2.0}
      POLYMARKET_OFFICIAL_OUTCOME_REFRESH_LIMIT: ${POLYMARKET_OFFICIAL_OUTCOME_REFRESH_LIMIT:-4}
      POLYMARKET_OFFICIAL_OUTCOME_PENDING_SWEEP_LIMIT: ${POLYMARKET_OFFICIAL_OUTCOME_PENDING_SWEEP_LIMIT:-20}
      POLYMARKET_OUTCOME_OUTPUT_LIMIT: ${POLYMARKET_OUTCOME_OUTPUT_LIMIT:-5000}
      POLYMARKET_NORMALIZER_INTERVAL_SECONDS: ${POLYMARKET_NORMALIZER_INTERVAL_SECONDS:-0.25}
      POLYMARKET_DUCKDB_THREADS: ${POLYMARKET_DUCKDB_THREADS:-1}
      POLYMARKET_DUCKDB_MEMORY_LIMIT: ${POLYMARKET_DUCKDB_MEMORY_LIMIT:-512MiB}
      POLYMARKET_DUCKDB_PRESERVE_INSERTION_ORDER: ${POLYMARKET_DUCKDB_PRESERVE_INSERTION_ORDER:-false}
    volumes:
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/raw:/var/lib/polymarket/raw
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/db:/var/lib/polymarket/db
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/live:/var/lib/polymarket/live
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/logs:/var/lib/polymarket/logs
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "command -v polymarket-engine >/dev/null && python -c \"import json, os, time; p='/var/lib/polymarket/live/normalized_health.json'; payload=json.load(open(p)); assert payload['schema_version']=='polymarket-normalized-health-v1'; assert time.time()-os.stat(p).st_mtime < 30\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  outcome-refresh:
    image: ${POLYMARKET_NORMALIZER_IMAGE:-polymarket-normalizer:latest}
    restart: unless-stopped
    user: "${POLYMARKET_UID:-1000}:${POLYMARKET_GID:-1000}"
    depends_on:
      - normalizer
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      [
        "polymarket-engine",
        "run-outcome-refresh-sidecar",
        "--duckdb-path",
        "/var/lib/polymarket/db/polymarket.duckdb",
        "--outcome-status-path",
        "/var/lib/polymarket/live/outcomes.json",
        "--interval-seconds",
        "${POLYMARKET_OUTCOME_REFRESH_INTERVAL_SECONDS:-30}",
      ]
    environment:
      TZ: ${POLYMARKET_DISPLAY_TZ:-America/Chicago}
      POLYMARKET_OFFICIAL_OUTCOME_SOURCE: ${POLYMARKET_OFFICIAL_OUTCOME_SOURCE:-clob}
      POLYMARKET_OFFICIAL_OUTCOME_TIMEOUT_SECONDS: ${POLYMARKET_OFFICIAL_OUTCOME_TIMEOUT_SECONDS:-2.0}
      POLYMARKET_OFFICIAL_OUTCOME_REFRESH_LIMIT: ${POLYMARKET_OFFICIAL_OUTCOME_REFRESH_LIMIT:-4}
      POLYMARKET_OFFICIAL_OUTCOME_PENDING_SWEEP_LIMIT: ${POLYMARKET_OFFICIAL_OUTCOME_PENDING_SWEEP_LIMIT:-20}
      POLYMARKET_OUTCOME_OUTPUT_LIMIT: ${POLYMARKET_OUTCOME_OUTPUT_LIMIT:-5000}
      POLYMARKET_DUCKDB_THREADS: ${POLYMARKET_DUCKDB_THREADS:-1}
      POLYMARKET_DUCKDB_MEMORY_LIMIT: ${POLYMARKET_DUCKDB_MEMORY_LIMIT:-512MiB}
      POLYMARKET_DUCKDB_PRESERVE_INSERTION_ORDER: ${POLYMARKET_DUCKDB_PRESERVE_INSERTION_ORDER:-false}
    volumes:
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/db:/var/lib/polymarket/db
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/live:/var/lib/polymarket/live
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "python -c \"import json, os, time; p='/var/lib/polymarket/live/outcomes.json'; payload=json.load(open(p)); assert payload['schema_version']=='polymarket-outcome-runtime-v1'; assert time.time()-os.stat(p).st_mtime < 120\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  api:
    image: ${POLYMARKET_NORMALIZER_IMAGE:-polymarket-normalizer:latest}
    restart: unless-stopped
    user: "${POLYMARKET_UID:-1000}:${POLYMARKET_GID:-1000}"
    depends_on:
      - collector
      - normalizer
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      [
        "uvicorn",
        "polymarket_engine.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      TZ: ${POLYMARKET_DISPLAY_TZ:-America/Chicago}
      POLYMARKET_STATUS_PATH: /var/lib/polymarket/live/status.json
      POLYMARKET_DUCKDB_PATH: /var/lib/polymarket/db/polymarket.duckdb
      POLYMARKET_NORMALIZED_HEALTH_PATH: /var/lib/polymarket/live/normalized_health.json
      POLYMARKET_PROBABILITY_STATUS_PATH: /var/lib/polymarket/live/probabilities.json
      POLYMARKET_PROBABILITY_INPUTS_PATH: /var/lib/polymarket/live/probability_inputs.json
      POLYMARKET_PROBABILITY_FRAGMENTS_PATH: /var/lib/polymarket/live/probability_fragments.json
      POLYMARKET_OUTCOME_STATUS_PATH: /var/lib/polymarket/live/outcomes.json
      POLYMARKET_VOLATILITY_STATUS_PATH: /var/lib/polymarket/live/volatility.json
      POLYMARKET_DATA_DIR: /var/lib/polymarket
      POLYMARKET_ENABLE_CONTAINER_STATUS: ${POLYMARKET_ENABLE_CONTAINER_STATUS:-0}
      POLYMARKET_ENABLE_RUNTIME_PROBABILITIES: ${POLYMARKET_ENABLE_RUNTIME_PROBABILITIES:-0}
      POLYMARKET_ALLOW_RUNTIME_PROBABILITY_COMPUTE: ${POLYMARKET_ALLOW_RUNTIME_PROBABILITY_COMPUTE:-0}
    ports:
      - "${POLYMARKET_API_PORT:-8000}:8000"
    volumes:
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/raw:/var/lib/polymarket/raw
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/db:/var/lib/polymarket/db
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/live:/var/lib/polymarket/live
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/logs:/var/lib/polymarket/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gpu-probability-worker:
    build:
      context: ../..
      dockerfile: deploy/gpu/Dockerfile
    image: ${POLYMARKET_CUDA_PROBABILITY_IMAGE:-polymarket-cuda-probability:latest}
    restart: unless-stopped
    user: "${POLYMARKET_UID:-1000}:${POLYMARKET_GID:-1000}"
    depends_on:
      - normalizer
    environment:
      TZ: ${POLYMARKET_DISPLAY_TZ:-America/Chicago}
      POLYMARKET_DUCKDB_PATH: /var/lib/polymarket/db/polymarket.duckdb
      POLYMARKET_PROBABILITY_STATUS_PATH: /var/lib/polymarket/live/probabilities.json
      POLYMARKET_PROBABILITY_INPUTS_PATH: /var/lib/polymarket/live/probability_inputs.json
      POLYMARKET_PROBABILITY_FRAGMENTS_PATH: /var/lib/polymarket/live/probability_fragments.json
      POLYMARKET_CUDA_PROBABILITY_INTERVAL_SECONDS: ${POLYMARKET_CUDA_PROBABILITY_INTERVAL_SECONDS:-1.0}
      POLYMARKET_CUDA_PROBABILITY_LIMIT: ${POLYMARKET_CUDA_PROBABILITY_LIMIT:-24}
      POLYMARKET_CUDA_PROBABILITY_VALID_SECONDS: ${POLYMARKET_CUDA_PROBABILITY_VALID_SECONDS:-30}
      POLYMARKET_CUDA_PROBABILITY_MAX_INPUT_SNAPSHOT_AGE_SECONDS: ${POLYMARKET_CUDA_PROBABILITY_MAX_INPUT_SNAPSHOT_AGE_SECONDS:-30.0}
      POLYMARKET_PROBABILITY_WORKER_MODE: ${POLYMARKET_PROBABILITY_WORKER_MODE:-ensemble}
      POLYMARKET_ENSEMBLE_GENERATOR_POLICY: ${POLYMARKET_ENSEMBLE_GENERATOR_POLICY:-all_four_every_cycle}
      POLYMARKET_PROBABILITY_CPU_TARGET_PERCENT: ${POLYMARKET_PROBABILITY_CPU_TARGET_PERCENT:-20.0}
      POLYMARKET_PROBABILITY_MAX_RSS_MB: ${POLYMARKET_PROBABILITY_MAX_RSS_MB:-512}
      POLYMARKET_PROBABILITY_MAX_CYCLE_RUNTIME_MS: ${POLYMARKET_PROBABILITY_MAX_CYCLE_RUNTIME_MS:-750}
      POLYMARKET_PROBABILITY_MAX_TOTAL_PATHS: ${POLYMARKET_PROBABILITY_MAX_TOTAL_PATHS:-80000}
      POLYMARKET_PROBABILITY_SUSTAINED_BREACH_CYCLES: ${POLYMARKET_PROBABILITY_SUSTAINED_BREACH_CYCLES:-3}
      POLYMARKET_ENSEMBLE_FRAGMENT_MAX_ROWS: ${POLYMARKET_ENSEMBLE_FRAGMENT_MAX_ROWS:-250000}
      OPENBLAS_NUM_THREADS: ${POLYMARKET_ENSEMBLE_CPU_THREADS:-1}
      OMP_NUM_THREADS: ${POLYMARKET_ENSEMBLE_CPU_THREADS:-1}
      MKL_NUM_THREADS: ${POLYMARKET_ENSEMBLE_CPU_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${POLYMARKET_ENSEMBLE_CPU_THREADS:-1}
    volumes:
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/raw:/var/lib/polymarket/raw
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/db:/var/lib/polymarket/db
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/live:/var/lib/polymarket/live
      - ${POLYMARKET_DATA_DIR:-/home/spoon/polymarket-data}/logs:/var/lib/polymarket/logs
    cpus: "${POLYMARKET_GPU_WORKER_CPUS:-1.0}"
    mem_limit: "${POLYMARKET_GPU_WORKER_MEM_LIMIT:-768m}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${POLYMARKET_CUDA_GPU_COUNT:-1}
              capabilities: [gpu]

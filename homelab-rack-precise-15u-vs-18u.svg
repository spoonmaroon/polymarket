  <rect class="bg" width="1600" height="1100"/>
  <text class="title" x="70" y="64">Accurate Rack Layout: 15U vs 18U</text>
  <text class="sub" x="70" y="94">One UniFi Pro Max 16 + one 24-port keystone panel. Only 16 switch ports can glow now; the remaining patch-panel ports are spare.</text>

